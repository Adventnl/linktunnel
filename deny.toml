# cargo-deny policy. Run: `cargo deny check`
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the dependency graph for every platform we ship, not just the host.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Ignores must carry a reason and an expiry review date.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is for the whole supported platform set; not every entry is hit on every build.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]

[licenses.private]
# Our own crates are `publish = false`; they carry no license expression yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own (unpublished) workspace crates have no version to pin.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # We use rustls everywhere; linking the system OpenSSL would add an unaudited C attack
    # surface and a packaging headache on three OSes.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

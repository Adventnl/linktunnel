{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus-signal.fullname" . }}
  labels:
    {{- include "nexus-signal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus-signal.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - port: 8443
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-signal.fullname" . }}
  labels:
    {{- include "nexus-signal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # One active replica only: stop the old one before starting the new one.
    type: Recreate
  selector:
    matchLabels:
      {{- include "nexus-signal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-signal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--listen", "0.0.0.0:8443"]
          ports:
            - name: http
              containerPort: 8443
          env:
            - name: NEXUS_SIGNAL_AUDIENCE
              value: {{ .Values.audience | quote }}
            - name: NEXUS_SIGNAL_TRUST_FORWARDED_FOR
              value: {{ .Values.trustForwardedFor | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: NEXUS_SIGNAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.databaseUrl }}
            - name: NEXUS_SIGNAL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.redisUrl }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

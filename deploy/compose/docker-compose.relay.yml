# Standalone TLS relay: both processes share a namespace; the plaintext hop is loopback only.
name: nexus-relay
services:
  relay-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      NEXUS_RELAY_DOMAIN: ${NEXUS_RELAY_DOMAIN:?set NEXUS_RELAY_DOMAIN}
    volumes:
      - ./Caddyfile.relay:/etc/caddy/Caddyfile:ro
      - relay_caddy_data:/data
      - relay_caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
  relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.relay
    network_mode: "service:relay-proxy"
    depends_on: [relay-proxy]
    restart: unless-stopped
    environment:
      NEXUS_RELAY_TOKEN: ${NEXUS_RELAY_TOKEN:?set a random admission token of at least 32 bytes}
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  relay_caddy_data: {}
  relay_caddy_config: {}

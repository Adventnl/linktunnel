[package]
name = "nexus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: fuzzing needs nightly and its own profile, and must not weigh on the
# product build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bytes = "1"
prost = "0.14"
serde_json = "1"
tempfile = "3"
nexus-audio = { path = "../crates/nexus-audio" }
nexus-clipboard = { path = "../crates/nexus-clipboard" }
nexus-codec = { path = "../crates/nexus-codec", features = ["software"] }
nexus-core = { path = "../crates/nexus-core" }
nexus-crypto = { path = "../crates/nexus-crypto" }
nexus-files = { path = "../crates/nexus-files" }
nexus-media = { path = "../crates/nexus-media" }
nexus-proto = { path = "../crates/nexus-proto" }
nexus-trust = { path = "../crates/nexus-trust" }
nexus-update = { path = "../crates/nexus-update" }

[profile.release]
debug = 1

[[bin]]
name = "wire_formats"
path = "fuzz_targets/wire_formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protobuf_messages"
path = "fuzz_targets/protobuf_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audio_player"
path = "fuzz_targets/audio_player.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jitter_buffer"
path = "fuzz_targets/jitter_buffer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h264_decoder"

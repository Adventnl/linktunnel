[package]
name = "nexus-codec"
description = "Video encode/decode backends behind small traits: OpenH264 (software), VideoToolbox (macOS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["software"]
# OpenH264, a C++ library. Turn it off to type-check the platform backends on a host without a
# C toolchain for the target.
software = ["dep:openh264", "dep:openh264-sys2"]

[dependencies]
bytes.workspace = true
nexus-core.workspace = true
nexus-proto.workspace = true
openh264 = { workspace = true, optional = true }
openh264-sys2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
yuv.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"

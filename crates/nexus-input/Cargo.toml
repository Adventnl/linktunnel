[package]
name = "nexus-input"
description = "Input injection backends (X11 XTest, recording) and HID usage tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nexus-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest", "randr"] }

[dev-dependencies]
nexus-testkit.workspace = true
x11rb = { version = "0.14", features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
nexus-desktop.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[package]
name = "nexus-crypto"
description = "Device identity, domain-separated signatures, and OS-backed secret storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Forces BLAKE3's portable Rust implementation (no C/asm). Lets CI and developers type-check
# the Windows/ARM-Linux code paths from a machine without a cross C toolchain. Release
# builds leave it off to keep the SIMD-accelerated implementation.
pure-blake3 = ["blake3/pure"]

[dependencies]
bip39.workspace = true
blake3.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
keyring.workspace = true
snow.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Remote · Verify access</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--panel:#fff;--text:#14171f;--muted:#5b6475;--accent:#2f6df6;--border:#d9dde5;--danger:#b12032;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--panel:#1c222d;--text:#f4f5f7;--muted:#b3bccb;--border:#3a4659;--accent:#2f6df6;--danger:#ff8e9c}}
*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,440px);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px}h1{font-size:24px;line-height:1.25;margin:0 0 12px;font-weight:650}p{line-height:1.6;margin:0 0 24px;color:var(--muted);overflow-wrap:anywhere}button{width:100%;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px system-ui;padding:14px;cursor:pointer}button:hover{filter:brightness(.92)}button:disabled{opacity:.6;cursor:wait}label{display:block;font-size:14px;font-weight:600;margin:24px 0 8px}input{width:100%;font:20px system-ui;font-variant-numeric:tabular-nums;letter-spacing:.15em;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);caret-color:var(--accent);margin-bottom:12px}input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}form[hidden]{display:none}#totp-button{background:var(--panel);color:var(--text);border:1px solid var(--border)}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}::selection{background:var(--accent);color:#fff}#status{margin:20px 0 0;min-height:1.6em;font-size:14px}#status.error{color:var(--danger)}
</style>
<main><h1 id="title">Verify access</h1><p id="detail">Connecting to Nexus Remote…</p><button id="verify" disabled>Use passkey</button><form id="totp-form" hidden><label id="totp-label" for="code">Authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" required><button id="totp-button" type="submit">Verify code</button></form><p id="status" role="status" aria-live="polite"></p></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const headers={Authorization:'Bearer '+token};let prompt;
const text={en:{title:'Verify access',register:'Add a passkey',button:'Use passkey',add:'Create passkey',detail:'Use your passkey to control ',registerDetail:'Add a passkey for unattended access to ',working:'Waiting for your authenticator…',code:'Authenticator code',verifyCode:'Verify code',done:'Response sent. Return to Nexus Remote to finish.',error:'The passkey could not be used. Try again or choose TOTP in Nexus.'},zh:{title:'验证访问',register:'添加通行密钥',button:'使用通行密钥',add:'创建通行密钥',detail:'使用通行密钥控制 ',registerDetail:'为无人值守访问添加通行密钥：',working:'正在等待身份验证器…',code:'身份验证器验证码',verifyCode:'验证验证码',done:'验证响应已发送。请返回 Nexus Remote 完成操作。',error:'无法使用通行密钥。请重试或在 Nexus 中选择 TOTP。'}};let t=text.en;
const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const button=document.querySelector('#verify'),status=document.querySelector('#status');
fetch('/challenge',{headers}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{prompt=p;t=p.chinese?text.zh:text.en;document.documentElement.lang=p.chinese?'zh-CN':'en';document.querySelector('#title').textContent=p.registration?t.register:t.title;document.querySelector('#detail').textContent=(p.registration?t.registerDetail:t.detail)+p.device;button.textContent=p.registration?t.add:t.button;button.hidden=!p.options.publicKey;button.disabled=false;document.querySelector("#totp-form").hidden=!p.options.totp;document.querySelector("#totp-label").textContent=t.code;document.querySelector("#totp-button").textContent=t.verifyCode}).catch(()=>{document.querySelector('#detail').textContent='This prompt has expired. Start again in Nexus Remote.'});
const send=async(response)=>{const sent=await fetch('/finish',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(response)});if(!sent.ok)throw Error();status.textContent=t.done;document.querySelector('#totp-button').disabled=true;button.disabled=true};
document.querySelector('#totp-form').onsubmit=async event=>{event.preventDefault();const code=document.querySelector('#code').value;if(!/^[0-9]{6}$/.test(code))return;document.querySelector('#totp-button').disabled=true;try{await send({totp:code})}catch(e){status.textContent=t.error;status.className='error';document.querySelector('#totp-button').disabled=false}};
button.onclick=async()=>{button.disabled=true;status.className='';status.textContent=t.working;try{let key=structuredClone(prompt.options.publicKey);key.challenge=decode(key.challenge);if(key.user)key.user.id=decode(key.user.id);for(const list of [key.allowCredentials,key.excludeCredentials])if(list)for(const c of list)c.id=decode(c.id);const credential=await navigator.credentials[prompt.registration?'create':'get']({publicKey:key});let response;if(credential.toJSON)response=credential.toJSON();else{const r=credential.response;response={id:credential.id,rawId:encode(credential.rawId),type:credential.type,response:{clientDataJSON:encode(r.clientDataJSON)},extensions:credential.getClientExtensionResults()};if(prompt.registration){response.response.attestationObject=encode(r.attestationObject);response.response.transports=r.getTransports?r.getTransports():[]}else{response.response.authenticatorData=encode(r.authenticatorData);response.response.signature=encode(r.signature);response.response.userHandle=r.userHandle?encode(r.userHandle):null}}await send(response)}catch(e){status.className='error';status.textContent=t.error;button.disabled=false}};
</script></html>

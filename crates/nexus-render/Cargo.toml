[package]
name = "nexus-render"
description = "The interactive viewer window: presents the remote screen, draws the cursor locally, forwards input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nexus-auth.workspace = true
serde_json.workspace = true
bytes.workspace = true
nexus-core.workspace = true
nexus-input.workspace = true
nexus-ipc.workspace = true
nexus-media.workspace = true
nexus-proto.workspace = true
softbuffer = "0.4"
wgpu = "30"
pollster = "0.4"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
winit = "0.30"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

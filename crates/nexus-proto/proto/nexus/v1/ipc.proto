syntax = "proto3";

package nexus.v1;

import "nexus/v1/common.proto";
import "nexus/v1/session.proto";
import "nexus/v1/files.proto";

// Local protocol between the Nexus agent (the one process that owns the device identity, the
// signaling connection and all sessions) and its clients: the CLI, the desktop app, the tray.
//
// Transport: a Unix domain socket (named pipe on Windows) inside the user's private runtime
// directory, plus a random token the client reads from a private file. Both are checked.

message IpcFrame {
  oneof body {
    IpcHello hello = 1;
    IpcWelcome welcome = 2;
    IpcRequest request = 3;
    IpcResponse response = 4;
    IpcEvent event = 5;
  }
}

message IpcHello {
  // Contents of the agent's token file; proves the caller can read the user's private directory.
  string token = 1;
  string client = 2;
}

message IpcWelcome {
  string agent_version = 1;
  bytes device_id = 2;
  ProtocolVersion protocol = 3;
}

// ----- requests ---------------------------------------------------------------------------

message IpcRequest {
  uint64 id = 1;
  oneof body {
    GetStatus status = 10;
    ListDevices list_devices = 11;
    PairingOffer pairing_offer = 12;
    PairingJoin pairing_join = 13;
    PairingConfirm pairing_confirm = 14;
    PairingCancel pairing_cancel = 15;
    Unpair unpair = 16;
    PingDevice ping = 17;
    SetLockdown set_lockdown = 18;
    Shutdown shutdown = 19;
    OpenSession open_session = 20;
    CloseSession close_session = 21;
    SessionInput session_input = 22;
    SessionKeyframe session_keyframe = 23;
    SessionQuality session_quality = 24;
    FileList file_list = 30;
    FileStatRequest file_stat = 31;
    FileMkdir file_mkdir = 32;
    FileRemove file_remove = 33;
    FileTransfer file_transfer = 34;
  }
}

message GetStatus {}
message ListDevices {}

// Start showing a pairing code and wait for another device to enter it.
message PairingOffer {
  // What the other device may do on this one (feature grants); empty = nothing.
  repeated string allow_peer_to = 1;
}

// Enter the code shown by another device.
message PairingJoin {
  string code = 1;
  // What this device asks to be allowed to do on the other one.
  repeated string request_on_peer = 2;
  // What the other device is allowed to do on this one.
  repeated string grant_to_peer = 3;
}

message PairingConfirm {
  uint64 pairing_id = 1;
  // True if the words shown on both devices are identical.
  bool words_match = 2;
}

message PairingCancel {
  uint64 pairing_id = 1;
}

message Unpair {
  bytes device_id = 1;
}

message PingDevice {
  bytes device_id = 1;
  uint32 pings = 2;
  uint32 stream_echoes = 3;
  uint32 datagrams = 4;
  uint64 bulk_bytes = 5;
}

message SetLockdown {
  bool enabled = 1;
}

message Shutdown {}

// ----- responses --------------------------------------------------------------------------

message IpcResponse {
  uint64 in_reply_to = 1;
  oneof body {
    IpcAck ack = 10;
    IpcError error = 11;
    Status status = 12;
    DeviceList devices = 13;
    PairingStarted pairing_started = 14;
    PingReport ping_report = 15;
    SessionOpened session_opened = 16;
    DirListing file_listing = 30;
    FileEntry file_entry = 31;
    TransferStarted transfer_started = 32;
  }
}

message IpcAck {}

enum IpcErrorCode {
  IPC_ERROR_CODE_UNSPECIFIED = 0;
  IPC_ERROR_CODE_INVALID_REQUEST = 1;
  IPC_ERROR_CODE_NOT_FOUND = 2;
  IPC_ERROR_CODE_BUSY = 3;
  IPC_ERROR_CODE_UNAVAILABLE = 4;
  IPC_ERROR_CODE_FAILED = 5;
  IPC_ERROR_CODE_PERMISSION_DENIED = 6;
}

message IpcError {
  IpcErrorCode code = 1;
  string message = 2;
}

message Status {
  bytes device_id = 1;
  string device_name = 2;
  string fingerprint = 3;
  string agent_version = 4;
  bool signal_connected = 5;
  string signal_url = 6;
  string relay_url = 7;
  repeated string direct_addresses = 8;
  bool lockdown = 9;
  uint32 paired_devices = 10;
  uint32 active_sessions = 11;
}

// One paired device as the dashboard shows it.
message DeviceView {
  bytes device_id = 1;
  string name = 2;
  PresenceState state = 3;
  bool online = 4;
  uint64 last_seen_ms = 5;
  OsInfo os = 6;
  // What this device may do on that one.
  repeated string grants_on_peer = 7;
  // What that device may do on this one.
  repeated string grants_from_peer = 8;
  // Kind of path of a live session with it, if any.
  PathKind path = 9;
  string active_user = 10;
  uint32 battery_percent = 11;
  string fingerprint = 12;
}

message DeviceList {
  repeated DeviceView devices = 1;
}

message PairingStarted {
  uint64 pairing_id = 1;
  // For an offer: the one-time code to show (six words). Empty for a join.
  string code = 2;
}

message LatencyView {
  uint64 count = 1;
  uint64 p50_us = 2;
  uint64 p95_us = 3;
  uint64 p99_us = 4;
  uint64 max_us = 5;
}

message PingReport {
  LatencyView control = 1;
  LatencyView stream = 2;
  LatencyView datagram = 3;
  double datagram_loss = 4;
  double throughput_mbps = 5;
  PathKind path_before = 6;
  PathKind path_after = 7;
  string remote = 8;
  uint64 rtt_us = 9;
}

// ----- events (pushed to every connected client) -----------------------------------------

message IpcEvent {
  oneof body {
    PairingSasReady pairing_sas = 1;
    PairingFinished pairing_finished = 2;
    DeviceChanged device_changed = 3;
    DeviceRemoved device_removed = 4;
    SignalState signal_state = 5;
    // Remote-desktop session traffic. Delivered only to the connection that opened the session.
    SessionVideo session_video = 6;
    SessionCursorShape session_cursor_shape = 7;
    SessionCursorPos session_cursor_pos = 8;
    SessionEnded session_ended = 9;
    TransferProgress transfer_progress = 10;
    TransferFinished transfer_finished = 11;
  }
}

message PairingSasReady {
  uint64 pairing_id = 1;
  // The four words both people must see identically.
  repeated string words = 2;
  string digits = 3;
  string peer_name = 4;
  bytes peer_device_id = 5;
  string peer_fingerprint = 6;
}

message PairingFinished {
  uint64 pairing_id = 1;
  bool success = 2;
  string reason = 3;
  bytes peer_device_id = 4;
  string peer_name = 5;
}

message DeviceChanged {
  DeviceView device = 1;
}

message DeviceRemoved {
  bytes device_id = 1;
}

message SignalState {
  bool connected = 1;
}

// ----- remote-desktop sessions (controller side, via the local agent) -----------------------
//
// The agent owns the network session; the viewer (CLI, app) owns decoding and presentation.
// Encoded video crosses this local socket; nothing the remote machine sends is ever parsed by
// the agent beyond framing.

message OpenSession {
  bytes device_id = 1;
  uint32 monitor = 2;
  // 0 = target default.
  uint32 max_fps = 3;
  uint32 bitrate_bps = 4;
  // False opens a control-only session (no screen).
  bool want_video = 5;
}

message CloseSession {
  uint64 session_id = 1;
}

// Input events as an `InputPacket` in the compact wire format (nexus_proto::wire::input).
message SessionInput {
  uint64 session_id = 1;
  bytes packet = 2;
}

message SessionKeyframe {
  uint64 session_id = 1;
}

message SessionQuality {
  uint64 session_id = 1;
  uint32 bitrate_bps = 2;
  uint32 fps = 3;
  uint32 scale_percent = 4;
}

message SessionOpened {
  uint64 session_id = 1;
  VideoStarted video = 2;
  repeated MonitorInfo monitors = 3;
  PathKind path = 4;
  string peer_name = 5;
}

message SessionVideo {
  uint64 session_id = 1;
  // `VideoFrameHeader` (wire format) immediately followed by the codec payload.
  bytes frame = 2;
  // Time from capture on the target to arrival at the agent (clock-offset corrected).
  uint64 upstream_us = 3;
}

message SessionCursorShape {
  uint64 session_id = 1;
  CursorShape shape = 2;
}

message SessionCursorPos {
  uint64 session_id = 1;
  // A `CursorUpdate` in wire format.
  bytes update = 2;
}

message SessionEnded {
  uint64 session_id = 1;
  string reason = 2;
}

// ----- files (over an open session; a control-only session is enough) -----------------------

message FileList {
  uint64 session_id = 1;
  // Absolute path on the remote device; empty lists its shared folders.
  string path = 2;
}

message FileStatRequest {
  uint64 session_id = 1;
  string path = 2;
}

message FileMkdir {
  uint64 session_id = 1;
  string path = 2;
}

message FileRemove {
  uint64 session_id = 1;
  string path = 2;
  bool recursive = 3;
}

// Copies one file. The local path is on the machine the agent runs on.
message FileTransfer {
  uint64 session_id = 1;
  string remote_path = 2;
  string local_path = 3;
  // False downloads remote → local; true uploads local → remote.
  bool upload = 4;
  bool overwrite = 5;
}

message TransferStarted {
  uint64 transfer_id = 1;
}

message TransferProgress {
  uint64 transfer_id = 1;
  uint64 done = 2;
  uint64 total = 3;
}

message TransferFinished {
  uint64 transfer_id = 1;
  bool ok = 2;
  FileErrorCode error_code = 3;
  string error_message = 4;
  uint64 size = 5;
  bytes blake3 = 6;
  // Non-zero if a partial copy was continued.
  uint64 resumed_from = 7;
}

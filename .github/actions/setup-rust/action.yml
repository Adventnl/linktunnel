name: Set up Rust
description: Installs the toolchain pinned in rust-toolchain.toml and a dependency cache.
inputs:
  targets:
    description: Extra comma-separated rustup targets
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # ALSA headers for audio capture/playback (cpal); opus itself is vendored and built by cmake.
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev cmake
    - name: Install pinned toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
        rustup default "$channel"
        if [ -n "${{ inputs.targets }}" ]; then
          rustup target add ${{ inputs.targets }}
        fi
        rustc --version
    - uses: Swatinem/rust-cache@v2
